# Installed by regolith-linux-fedora/actions tools/install-fedora-workflows.sh
name: Fedora Test Pull Request

on:
  pull_request:
    branches:
      - "fedora/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: regolith-linux-fedora/actions/.github/workflows/fedora-test-pr.yml@fedora/main
    # The package (and its voulage package model entry) is sway-audio-idle-inhibit,
    # not the repository name.
    with:
      name: sway-audio-idle-inhibit
    secrets: inherit
